name: PEAD Stock Screener Daily Run

on:
  schedule:
    # 毎日日本時間の夕方18:00 (UTC 9:00) に自動実行する場合
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # 手動でも実行できるようにする設定

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jquants-api-client pandas requests

      - name: Run Screener Script
        env:
          JQUANTS_MAIL: ${{ secrets.JQUANTS_MAIL }}
          JQUANTS_PASSWORD: ${{ secrets.JQUANTS_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python stock_screener.py

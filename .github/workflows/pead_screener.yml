name: PEAD Stock Screener Daily Run

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 1-5'

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jquants-api-client pandas requests

      - name: Run Screener Script
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python stock_screener.py
